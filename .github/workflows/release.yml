name: Release Obsidian Plugin

# Manually triggered: runs lint and the e2e suite first, and only a green run
# bumps the version, tags, and publishes the GitHub release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version (x.y.z), overrides the bump choice"
        required: false

# Never run two releases at once
concurrency: release

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn run lint
      - run: yarn run slint

  e2e:
    uses: ./.github/workflows/e2e.yaml

  release:
    runs-on: ubuntu-latest
    needs: [lint, e2e]
    permissions:
      contents: write
      # Required to sign artifact attestations for the release assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          NEW_VERSION=$(node version-bump.mjs "${{ inputs.version || inputs.bump }}")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: yarn run build

      # Lets users cryptographically verify that the release assets were
      # built from this repository (gh attestation verify <file> -R <repo>)
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json
          git commit -m "Release ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push origin HEAD "${{ steps.version.outputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
