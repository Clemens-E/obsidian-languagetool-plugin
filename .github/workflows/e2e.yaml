name: E2E Tests

# Runs on manual trigger, or as a gate inside the release workflow
on:
  workflow_dispatch:
  workflow_call:

env:
  # appVersion/installerVersion pairs: the oldest supported Obsidian
  # (minAppVersion) and the latest release
  OBSIDIAN_VERSIONS: earliest/earliest latest/latest

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      # Self-hosted LanguageTool keeps the tests off the public API, whose
      # per-IP rate limit shared GitHub runners exhaust quickly
      languagetool:
        image: erikvl87/languagetool:latest
        ports:
          - 8010:8010
        env:
          # The default heap runs out while the German models load, which
          # kills the server and fails every check that follows. Two
          # Obsidian instances query it at once, so give it room.
          Java_Xms: 1g
          Java_Xmx: 2g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build plugin
        run: yarn build

      - name: Set up virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb herbstluftwm dzen2
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX &
          sleep 1
          herbstluftwm &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Resolve Obsidian versions for the cache key
        run: |
          npx tsx wdio.conf.mts > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache

      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ hashFiles('obsidian-versions-lock.txt') }}

      - name: Wait for LanguageTool to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8010/v2/languages" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "LanguageTool server did not become ready" >&2
          exit 1

      # The first check in a language loads its models, which takes far
      # longer than a test waits for an underline. Load the languages the
      # fixtures use before the suite starts.
      - name: Warm up LanguageTool
        run: |
          for lang in en-US de-DE auto; do
            start=$(date +%s)
            curl -fsS -o /dev/null "http://localhost:8010/v2/check" \
              --data-urlencode "language=$lang" \
              --data-urlencode "text=This is a sentense. Das ist ein schöönes Beispiel."
            echo "$lang warmed up in $(( $(date +%s) - start ))s"
          done

      - name: Run e2e tests
        run: yarn test:e2e
        env:
          WDIO_MAX_INSTANCES: "2"
          LANGUAGETOOL_URL: http://localhost:8010

      # A dead LanguageTool server shows up as failing checks across every
      # spec; its own log tells the two apart
      - name: Show LanguageTool server logs
        if: failure()
        run: docker logs "${{ job.services.languagetool.id }}" 2>&1 | tail -n 100
